name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            next-app/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Install root tooling
        working-directory: .
        run: npm ci

      - name: Verify content sync
        run: npm run verify-content

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Format check
        working-directory: .
        run: npm run format:check

      - name: Build
        run: npm run sync-content && npm run build
